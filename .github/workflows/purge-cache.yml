name: Purge Cloudflare cache

# On demand only — nothing triggers this automatically, and it is not part of
# deploying. Cloudflare Workers Builds deploys every push to main on its own.
#
# You should rarely need this. Assets are served with
# `Cache-Control: public, max-age=0, must-revalidate` and a content-derived
# ETag, so replacing a file makes caches revalidate and fetch the new bytes.
# It exists for the case where that stops being true — a Cache Rule or Page
# Rule added in the Cloudflare dashboard can override origin cache headers,
# and nothing in this repo would show it.
#
# Run it from the Actions tab ("Run workflow"), or:
#   gh workflow run purge-cache.yml
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  purge:
    name: Purge everything
    runs-on: ubuntu-latest
    steps:
      # Report what Cloudflare actually said. `curl -sf` fails the run but
      # prints nothing, leaving only "exit code 22" to work from. The response
      # body carries the real reason and contains no secrets.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          : "${CLOUDFLARE_API_TOKEN:?not set — add it under Settings > Secrets and variables > Actions}"
          : "${CLOUDFLARE_ZONE_ID:?not set — add it under Settings > Secrets and variables > Actions}"

          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "HTTP $status"
          jq . response.json 2>/dev/null || cat response.json

          if [ "$status" != "200" ]; then
            code=$(jq -r '.errors[0].code // empty' response.json 2>/dev/null || true)
            case "$code" in
              10000) hint="the API token lacks the 'Zone > Cache Purge' permission, or has expired" ;;
              7003)  hint="CLOUDFLARE_ZONE_ID does not match a zone this token can reach" ;;
              *)     hint="see the response above" ;;
            esac
            echo "::error::Cloudflare rejected the purge (HTTP $status, error ${code:-none}) — $hint"
            exit 1
          fi

          echo "Cache purged."
